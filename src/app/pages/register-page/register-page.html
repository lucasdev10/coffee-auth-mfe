<div class="register-container" role="region" aria-label="Registration form">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title id="register-heading">
        <mat-icon aria-hidden="true">person_add</mat-icon>
        <span>Sign Up</span>
      </mat-card-title>
      <mat-card-subtitle>Create your account</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (error$ | async) {
        <div class="error-message" role="alert" aria-live="assertive">
          <mat-icon aria-hidden="true">error</mat-icon>
          <span>{{ error$ | async }}</span>
        </div>
      }

      <form role="form" [attr.aria-labelledby]="'register-heading'">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full Name</mat-label>
          <input
            matInput
            type="text"
            [formField]="registerForm.fullName"
            placeholder="Your full name"
            aria-required="true"
            aria-describedby="fullname-error"
            autocomplete="name"
          />
          <mat-icon matPrefix aria-hidden="true">person</mat-icon>
          <app-form-error [control]="registerForm.fullName" id="fullname-error"></app-form-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-mail</mat-label>
          <input
            matInput
            type="email"
            [formField]="registerForm.email"
            placeholder="your@email.com"
            aria-required="true"
            aria-describedby="email-error"
            autocomplete="email"
          />
          <mat-icon matPrefix aria-hidden="true">email</mat-icon>
          <app-form-error [control]="registerForm.email" id="email-error"></app-form-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            [formField]="registerForm.password"
            placeholder="At least 6 characters"
            aria-required="true"
            aria-describedby="password-error"
            autocomplete="new-password"
          />
          <mat-icon matPrefix aria-hidden="true">lock</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
            [attr.aria-pressed]="!hidePassword()"
            tabindex="0"
          >
            <mat-icon aria-hidden="true">{{
              hidePassword() ? 'visibility_off' : 'visibility'
            }}</mat-icon>
          </button>
          <app-form-error [control]="registerForm.password" id="password-error"></app-form-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input
            matInput
            [type]="hideConfirmPassword() ? 'password' : 'text'"
            [formField]="registerForm.confirmPassword"
            placeholder="Repeat your password"
            aria-required="true"
            aria-describedby="confirm-password-error"
            autocomplete="new-password"
          />
          <mat-icon matPrefix aria-hidden="true">lock_outline</mat-icon>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="toggleConfirmPasswordVisibility()"
            [attr.aria-label]="hideConfirmPassword() ? 'Show confirm password' : 'Hide confirm password'"
            [attr.aria-pressed]="!hideConfirmPassword()"
            tabindex="0"
          >
            <mat-icon aria-hidden="true">{{
              hideConfirmPassword() ? 'visibility_off' : 'visibility'
            }}</mat-icon>
          </button>
          <app-form-error [control]="registerForm.confirmPassword" id="confirm-password-error"></app-form-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="button"
          class="full-width submit-button"
          [disabled]="!canSubmit()"
          (click)="onSubmit()"
          aria-label="Submit registration form"
          tabindex="0"
        >
          @if (isLoading$ | async) {
            <mat-spinner diameter="20" aria-hidden="true"></mat-spinner>
            <span>Creating account...</span>
          } @else {
            <span>Sign Up</span>
          }
        </button>
      </form>

      <div class="login-user">
        <p>Already have an account?</p>
        <a [routerLink]="'/auth/login'" aria-label="Go to login">Sign in</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
